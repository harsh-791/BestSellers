name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Reject committed secrets
        run: ./scripts/check-secrets.sh
      - name: Test
        run: mvn -B verify

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t "bestsellers:${{ github.sha }}" .
      - name: Save image artifact
        run: docker save "bestsellers:${{ github.sha }}" -o bestsellers.tar
      - uses: actions/upload-artifact@v4
        with:
          name: bestsellers-image
          path: bestsellers.tar
          retention-days: 3
