name: cd

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the successful CI run for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow ci.yml \
            --commit "${{ github.sha }}" \
            --status success \
            --json databaseId \
            --jq '.[0].databaseId')"
          if [ -z "${run_id}" ] || [ "${run_id}" = "null" ]; then
            echo "No successful ci run for ${{ github.sha }}. Wait for ci.yml to pass, then run cd again." >&2
            exit 1
          fi
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"

      - name: Download the image built by CI
        uses: actions/download-artifact@v4
        with:
          name: bestsellers-image
          path: dist
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Install kind, Helm, and kubectl
        run: |
          curl -fsSL -o kind "https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64"
          sudo install -m 0755 kind /usr/local/bin/kind
          curl -fsSL "https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz" | tar -xz
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
          curl -fsSL -o kubectl "https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl"
          sudo install -m 0755 kubectl /usr/local/bin/kubectl

      - name: Load image into Docker
        run: docker load -i dist/bestsellers.tar

      - name: Create cluster and deploy
        run: |
          kind create cluster --name bestsellers --config kind/cluster.yaml
          kind load docker-image "bestsellers:${{ github.sha }}" --name bestsellers
          helm upgrade --install observability helm/observability --namespace bestsellers --create-namespace --wait --timeout 180s
          helm upgrade --install bestsellers helm/bestsellers \
            --namespace bestsellers \
            --set image.repository=bestsellers \
            --set image.tag="${{ github.sha }}" \
            --set image.pullPolicy=IfNotPresent \
            --set autoscaling.enabled=false \
            --wait --timeout 180s

      - name: Smoke test
        run: ./scripts/smoke.sh
