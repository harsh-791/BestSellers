apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bestsellers.fullname" . }}
  labels:
    {{- include "bestsellers.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "bestsellers.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "bestsellers.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.port | quote }}
        prometheus.io/path: /metrics
        checksum/config: {{ printf "%s-%s-%s-%s" (.Values.featureFlags.priceLookup | toString) (.Values.chaos.failHealth | toString) .Values.tracing.otlpEndpoint (.Values.csvPath | default "") | sha256sum }}
    spec:
      serviceAccountName: {{ include "bestsellers.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "bestsellers.selectorLabels" . | nindent 14 }}
      containers:
        - name: bestsellers
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: SERVER_PORT
              value: {{ .Values.service.port | quote }}
            - name: FEATURE_PRICE_LOOKUP
              value: {{ .Values.featureFlags.priceLookup | toString | quote }}
            - name: FAIL_HEALTH
              value: {{ .Values.chaos.failHealth | toString | quote }}
            - name: OTEL_SERVICE_NAME
              value: bestsellers
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.tracing.otlpEndpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            {{- if .Values.csvPath }}
            - name: CSV_PATH
              value: {{ .Values.csvPath | quote }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
