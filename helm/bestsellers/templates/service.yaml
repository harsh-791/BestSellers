apiVersion: v1
kind: Service
metadata:
  name: {{ include "bestsellers.fullname" . }}
  labels:
    {{- include "bestsellers.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "bestsellers.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
