apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bestsellers.fullname" . }}
  labels:
    {{- include "bestsellers.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bestsellers.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: jaeger
      ports:
        - protocol: TCP
          port: 4318
